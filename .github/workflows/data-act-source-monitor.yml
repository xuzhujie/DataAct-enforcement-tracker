name: Data Act source monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  source-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tracker
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore prior source fingerprints
        uses: actions/cache/restore@v4
        with:
          path: .monitor/source-health-baseline.json
          key: data-act-source-health-${{ github.repository }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            data-act-source-health-${{ github.repository }}-${{ github.ref_name }}-

      - name: Validate registry
        id: registry-validation
        run: npm run validate:registry

      - name: Check official source URLs
        id: source-health
        continue-on-error: true
        run: npm run check:sources -- --output source-health.json

      - name: Compare source fingerprints
        id: source-changes
        if: always()
        run: npm run compare:sources -- --previous .monitor/source-health-baseline.json --current source-health.json --output source-changes.json

      - name: Refresh source fingerprint baseline
        if: always() && steps.source-health.outcome != 'cancelled'
        run: |
          mkdir -p .monitor
          if [ -f source-health.json ]; then cp source-health.json .monitor/source-health-baseline.json; fi

      - name: Save current source fingerprints
        if: always() && steps.source-health.outcome != 'cancelled'
        uses: actions/cache/save@v4
        with:
          path: .monitor/source-health-baseline.json
          key: data-act-source-health-${{ github.repository }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Build maintenance report
        id: maintenance-report
        if: always()
        run: npm run report:maintenance -- --source-health source-health.json --output maintenance-report.json

      - name: Upload source-health and maintenance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-act-maintenance-reports
          path: |
            source-health.json
            source-changes.json
            maintenance-report.json
          if-no-files-found: ignore

      - name: Create or update source-content change issue
        if: always() && steps.source-changes.outcome == 'success' && steps.source-changes.outputs.change_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const changeCount = '${{ steps.source-changes.outputs.change_count }}'
            const changedCount = '${{ steps.source-changes.outputs.changed_count }}'
            const failedCount = '${{ steps.source-changes.outputs.failed_count }}'
            const recoveredCount = '${{ steps.source-changes.outputs.recovered_count }}'
            const title = 'Data Act official source changed or recovered'
            const body = [
              `The source monitor detected ${changeCount} source change(s): ${changedCount} content change(s), ${failedCount} failure(s), and ${recoveredCount} recovery/recoveries.`,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Review `source-changes.json` and the linked primary source before changing any verified registry field. This alert does not publish legal facts automatically.',
            ].join('\n')
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            })
            const existing = openIssues.find((issue) => issue.title === title)
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              })
            }

      - name: Create or update source-health failure issue
        if: always() && steps.source-health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Data Act source check failed'
            const body = [
              'The scheduled Data Act registry/source-health check failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Review the uploaded `source-health.json` and `maintenance-report.json` artifacts before changing any verified registry field.',
            ].join('\n')
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            })
            const existing = openIssues.find((issue) => issue.title === title)
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              })
            }

      - name: Create or update registry-pipeline failure issue
        if: always() && (steps.registry-validation.outcome == 'failure' || steps.maintenance-report.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Data Act tracker maintenance pipeline failed'
            const body = [
              'The scheduled Data Act registry validation or maintenance-report step failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Review the uploaded maintenance artifacts and fix the pipeline before changing verified legal facts.',
            ].join('\n')
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            })
            const existing = openIssues.find((issue) => issue.title === title)
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              })
            }

      - name: Create or update due-review reminder issue
        if: always() && steps.maintenance-report.outcome == 'success' && steps.maintenance-report.outputs.due_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const dueCount = '${{ steps.maintenance-report.outputs.due_count }}'
            const highPriorityDueCount = '${{ steps.maintenance-report.outputs.high_priority_due_count }}'
            const title = 'Data Act tracker maintenance review due'
            const body = [
              `The scheduled maintenance report has ${dueCount} review item(s) due, including ${highPriorityDueCount} high-priority item(s).`,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Review `maintenance-report.json`, refresh primary evidence, and update the registry only after human verification.',
            ].join('\n')
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            })
            const existing = openIssues.find((issue) => issue.title === title)
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              })
            }
