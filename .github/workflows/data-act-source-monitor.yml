name: Data Act source monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  source-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tracker
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate registry
        run: npm run validate:registry

      - name: Check official source URLs
        run: npm run check:sources -- --output source-health.json

      - name: Upload source-health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-act-source-health
          path: source-health.json
          if-no-files-found: ignore

      - name: Create or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Data Act source check failed'
            const body = [
              'The scheduled Data Act registry/source-health check failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Review the uploaded `source-health.json` artifact before changing any verified registry field.',
            ].join('\n')
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            })
            const existing = openIssues.find((issue) => issue.title === title)
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              })
            }
